$:
  vscode:
    - docker:
        image: node:20
        volumes:
          - node_modules:copy-on-write
      services:
        - vscode
        - docker
      stages:
        - name: npm install
          script: npm install
        - name: bash
          script: bash

master:
  push:
    - docker:
        # 声明式的构建环境 https://docs.cnb.cool/
        image: node:20
        volumes:
          # 声明式的构建缓存 https://docs.cnb.cool/zh/grammar/pipeline.html#volumes
          - node_modules:copy-on-write
      services:
        # 流水线中启用 docker 服务
        - docker
      stages:
        - name: 编译
          script:
            - npm install && npm run build
        # 云原生构建自动构建Docker镜像并将它发布到制品库参考【上传Docker制品】https://docs.cnb.cool/zh/artifact/docker.html
        - name: docker login
          script:
            - docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: docker build
          script:
            - docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT} .
        - name: docker push
          script:
            - docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}
        - name: docker push
          script:
            - docker tag ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT} ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
            - docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest